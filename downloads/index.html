<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads — Gooske</title>
  <script data-goatcounter="https://gooske.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f11; --surface: #18181c; --surface2: #222228;
      --border: rgba(255,255,255,0.08); --text: #f0f0f0; --muted: #888;
      --accent: #01bfa5; --accent-dim: rgba(1,191,165,0.12);
      --green: #01e3c0; --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; }

    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 52px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .logo { font-weight: 500; font-size: 15px; letter-spacing: -0.01em; color: var(--text); text-decoration: none; }
    .logo-dot { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 6px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
    .btn-ghost { background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--muted); font-family: inherit; font-size: 12px; padding: 5px 11px; text-decoration: none; transition: all .15s; }
    .btn-ghost:hover { border-color: rgba(255,255,255,.2); color: var(--text); }

    main { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 48px 24px 60px; }

    h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 300; letter-spacing: -0.03em; margin-bottom: 8px; }
    h1 span { color: var(--accent); }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

    .files { display: flex; flex-direction: column; gap: 12px; }

    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.15s;
    }
    .file-card:hover { border-color: rgba(255,255,255,0.14); }

    .file-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      background: var(--surface2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-info { flex: 1; min-width: 0; }
    .file-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .file-size { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 4px; }

    .file-dl {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .file-dl:hover { background: var(--accent); color: #fff; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 60px 0;
    }

    footer { text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo"><span class="logo-dot"></span>Gooske</a>
  <a href="/" class="btn-ghost">← Home</a>
</header>

<main>
  <h1><span>Downloads</span></h1>
  <p class="subtitle">Files available for download. Hosted on GitHub.</p>

  <div class="files" id="files-list">
    <div class="empty" id="empty-msg">Loading…</div>
  </div>
</main>

<footer><a href="/">← Home</a></footer>

<script>
  // ── ADD FILES HERE ──────────────────────────────────────────
  // url   : direct link to the GitHub release asset
  // name  : display name shown on the card
  // desc  : short description
  //
  // Icon, file size, and extension are fetched automatically.
  // ─────────────────────────────────────────────────────────────────
  const FILES = [
    // {
    //   url:  "https://github.com/YOUR_USERNAME/YOUR_REPO/releases/download/v1.0/myapp-setup.exe",
    //   name: "MyApp v1.0",
    //   desc: "Windows installer for MyApp."
    // },
   {
      url: "https://gooske.be/downloads/files/Logo.png"
      name: "Logo picture"
      desc: "The logo of my site here"
   },
  ];
  // ─────────────────────────────────────────────────────────────────

  const ICONS = {
    exe: '🖥️', msi: '🖥️', dmg: '🍎', pkg: '🍎', deb: '🐧', rpm: '🐧', appimage: '🐧',
    zip: '🗜️', gz: '🗜️', tar: '🗜️', '7z': '🗜️', rar: '🗜️',
    pdf: '📄', doc: '📄', docx: '📄', txt: '📄', md: '📄',
    jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', svg: '🖼️', webp: '🖼️',
    mp3: '🎵', wav: '🎵', ogg: '🎵', flac: '🎵',
    mp4: '🎬', mkv: '🎬', avi: '🎬', mov: '🎬',
    js: '📜', ts: '📜', py: '📜', sh: '📜', bat: '📜',
    json: '📋', xml: '📋', csv: '📋', yaml: '📋', yml: '📋',
  };

  function iconFor(ext) { return ICONS[(ext || '').toLowerCase()] || '💾'; }

  function render() {
    const list  = document.getElementById('files-list');
    const empty = document.getElementById('empty-msg');

    if (FILES.length === 0) {
      empty.textContent = 'No files yet — check back soon.';
      return;
    }

    empty.remove();

    for (const file of FILES) {
      const ext  = file.url.split('.').pop();
      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `
        <div class="file-icon">${iconFor(ext)}</div>
        <div class="file-info">
          <div class="file-name">${file.name}</div>
          <div class="file-desc">${file.desc}</div>
          <div class="file-size">.${ext.toLowerCase()}</div>
        </div>
        <a class="file-dl" href="${file.url}" download>Download</a>
      `;
      list.appendChild(card);
    }
  }

  render();
</script>
</body>
</html>
