<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gooske</title>
  <!-- GoatCounter -->
  <script data-goatcounter="https://gooske.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #222228;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: #888;
      --accent: #01bfa5;
      --accent-dim: rgba(1,191,165,0.12);
      --green: #01e3c0;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .logo {
      font-weight: 500;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }

    .logo-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 48px;
    }

    .hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      font-size: 15px;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.6;
      margin: 0 auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .card-icon {
      font-size: 24px;
      line-height: 1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 500;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .card.primary {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo"><span class="logo-dot"></span>Gooske</a>
</header>

<main>
  <div class="hero">
    <h1>Hi, I'm <span>Gooske</span></h1>
    <p>A simple personal site with some small projects and experiments.</p>
  </div>

  <div class="cards">
    <a href="/chat/" class="card primary">
      <span class="card-icon">💬</span>
      <span class="card-title">Chat</span>
      <span class="card-desc">A free, simple multi-user chat. Just pick a username and join.</span>
    </a>
    <a href="/snowflake/" class="card">
		<span class="card-icon">❄️</span>
		<span class="card-title">Snowflake</span>
		<span class="card-desc">Help fight internet censorship by running a Tor proxy in your browser.</span>
	</a>
    <!-- Add more cards here as you build more things -->
  </div>
</main>

<footer>
  <a href="mailto:noahbrown1252@gmail.com">Contact</a>
</footer>

</body>
</html>
