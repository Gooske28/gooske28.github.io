<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <!-- GoatCounter -->
  <script data-goatcounter="https://gooske.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #222228;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: #888;
      --accent: #7c6af7;
      --accent-dim: rgba(124,106,247,0.15);
      --green: #3ecf8e;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 12px;
      padding: 2rem;
    }

    #auth-screen h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 8px;
    }

    #auth-screen h1 span { color: var(--accent); }

    #auth-screen p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      text-align: center;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    .auth-form input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .auth-form input:focus { border-color: var(--accent); }
    .auth-form input::placeholder { color: var(--muted); }

    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 11px 14px;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }

    #auth-error {
      color: #f87171;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .auth-switch {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }

    .auth-switch a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }

    /* ── CHAT SCREEN ── */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .logo {
      font-weight: 500;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .logo-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #online-count {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    #username-display {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      padding: 5px 11px;
      transition: all 0.15s;
    }

    .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    /* ── MESSAGES ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: min(72%, 560px);
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.own { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      padding: 0 4px;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .msg-meta .uname { font-weight: 500; }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.own .msg-bubble {
      background: var(--accent);
      border-bottom-right-radius: 4px;
    }

    .msg.other .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .date-divider {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 12px;
      border-radius: 20px;
      margin: 12px 0;
    }

    /* ── INPUT BAR ── */
    #input-bar {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--bg);
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      max-height: 120px;
      outline: none;
      overflow-y: auto;
      padding: 9px 13px;
      resize: none;
      transition: border-color 0.15s;
    }

    #msg-input:focus { border-color: rgba(124,106,247,0.5); }
    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 18px;
      height: 40px;
      line-height: 1;
      transition: opacity 0.15s, transform 0.1s;
      width: 40px;
    }

    #send-btn:hover { opacity: 0.85; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.3; cursor: default; }

    /* ── SYSTEM MESSAGES ── */
    .sys-msg {
      align-self: center;
      font-size: 12px;
      color: var(--muted);
      padding: 2px 0;
      font-style: italic;
    }

    /* ── SETUP BANNER ── */
    #setup-banner {
      background: rgba(124,106,247,0.12);
      border: 1px solid rgba(124,106,247,0.3);
      border-radius: 10px;
      color: #c8c1ff;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 20px 16px;
      padding: 12px 16px;
    }

    #setup-banner code {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 1px 5px;
    }

    #setup-banner a { color: #a89fff; }
  </style>
</head>
<body>

<!-- ══════════════ AUTH SCREEN ══════════════ -->
<div id="auth-screen">
  <h1><span>◈</span> Chat</h1>
  <p>Sign in or create an account to start chatting.</p>

  <div class="auth-form" id="auth-form">
    <input id="email-input" type="email" placeholder="Email" autocomplete="email" />
    <input id="pass-input" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn-primary" id="auth-btn">Sign in</button>
    <div id="auth-error"></div>
    <div class="auth-switch">
      No account? <a id="toggle-mode">Create one</a>
    </div>
  </div>
</div>

<!-- ══════════════ CHAT SCREEN ══════════════ -->
<div id="chat-screen">
  <header>
    <div class="header-left">
      <div class="logo"><span class="logo-dot"></span>Chat</div>
      <span id="online-count">0 online</span>
    </div>
    <div class="header-right">
      <span id="username-display"></span>
      <button class="btn-ghost" id="signout-btn">Sign out</button>
    </div>
  </header>

  <div id="setup-banner" style="display:none">
    ⚠️ <strong>Firebase not configured.</strong> Open <code>index.html</code>, find the
    <code>FIREBASE CONFIG</code> section and paste your project's config object.
    <a href="https://firebase.google.com/docs/web/setup" target="_blank">Setup guide →</a>
  </div>

  <div id="messages"></div>

  <div id="input-bar">
    <textarea id="msg-input" rows="1" placeholder="Message…"></textarea>
    <button id="send-btn" title="Send">↑</button>
  </div>
</div>

<!-- ══════════════ FIREBASE SDK ══════════════ -->
<script type="module">
  // ─────────────────────────────────────────────────────────────────
  //  ▼▼▼  FIREBASE CONFIG  ▼▼▼
  //
  //  1. Go to https://console.firebase.google.com/
  //  2. Create a project (or open existing)
  //  3. Add a Web app → copy the config object below
  //  4. In Firebase console: enable Authentication → Email/Password
  //  5. In Firebase console: create Realtime Database (start in test mode)
  //     Then update rules to (paste in Rules tab):
  //
  //     {
  //       "rules": {
  //         "messages": { ".read": "auth != null", ".write": "auth != null" },
  //         "presence": { ".read": "auth != null", ".write": "auth != null" }
  //       }
  //     }
  //
  // ─────────────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "PASTE_YOUR_API_KEY",
    authDomain:        "PASTE_YOUR_AUTH_DOMAIN",
    databaseURL:       "PASTE_YOUR_DATABASE_URL",
    projectId:         "PASTE_YOUR_PROJECT_ID",
    storageBucket:     "PASTE_YOUR_STORAGE_BUCKET",
    messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
    appId:             "PASTE_YOUR_APP_ID"
  };
  // ─────────────────────────────────────────────────────────────────

  const CONFIGURED = !firebaseConfig.apiKey.startsWith("PASTE");

  import { initializeApp }                              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword,
           signInWithEmailAndPassword, signOut,
           onAuthStateChanged, updateProfile }          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded,
           serverTimestamp, onValue, set, onDisconnect,
           query, limitToLast }                        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ── DOM refs ──
  const authScreen  = document.getElementById('auth-screen');
  const chatScreen  = document.getElementById('chat-screen');
  const emailInput  = document.getElementById('email-input');
  const passInput   = document.getElementById('pass-input');
  const authBtn     = document.getElementById('auth-btn');
  const authError   = document.getElementById('auth-error');
  const toggleMode  = document.getElementById('toggle-mode');
  const messagesEl  = document.getElementById('messages');
  const msgInput    = document.getElementById('msg-input');
  const sendBtn     = document.getElementById('send-btn');
  const signoutBtn  = document.getElementById('signout-btn');
  const uDisplay    = document.getElementById('username-display');
  const onlineCount = document.getElementById('online-count');
  const setupBanner = document.getElementById('setup-banner');

  if (!CONFIGURED) setupBanner.style.display = 'block';

  // ── Firebase init ──
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getDatabase(app);

  // ── Auth mode toggle ──
  let isSignup = false;
  toggleMode.addEventListener('click', () => {
    isSignup = !isSignup;
    authBtn.textContent        = isSignup ? 'Create account' : 'Sign in';
    toggleMode.textContent     = isSignup ? 'Sign in instead' : 'Create one';
    toggleMode.previousSibling.textContent = isSignup ? 'Have an account? ' : 'No account? ';
    authError.textContent = '';
  });

  // ── Auth submit ──
  authBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const pass  = passInput.value;
    if (!email || !pass) return;
    authBtn.disabled = true;
    authError.textContent = '';
    try {
      if (isSignup) {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        const name = email.split('@')[0];
        await updateProfile(cred.user, { displayName: name });
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch (e) {
      authError.textContent = friendlyError(e.code);
      authBtn.disabled = false;
    }
  });

  passInput.addEventListener('keydown', e => { if (e.key === 'Enter') authBtn.click(); });

  signoutBtn.addEventListener('click', () => signOut(auth));

  // ── Auth state ──
  let currentUser = null;
  let presenceRef = null;
  let msgListenerAttached = false;

  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      authScreen.style.display  = 'none';
      chatScreen.style.display  = 'flex';
      uDisplay.textContent = user.displayName || user.email.split('@')[0];
      setupPresence(user.uid);
      if (!msgListenerAttached) { listenMessages(); msgListenerAttached = true; }
    } else {
      currentUser = null;
      authScreen.style.display  = 'flex';
      chatScreen.style.display  = 'none';
      authBtn.disabled = false;
    }
  });

  // ── Presence ──
  function setupPresence(uid) {
    presenceRef = ref(db, `presence/${uid}`);
    set(presenceRef, { online: true, uid });
    onDisconnect(presenceRef).remove();
    onValue(ref(db, 'presence'), snap => {
      const n = snap.exists() ? Object.keys(snap.val()).length : 0;
      onlineCount.textContent = `${n} online`;
    });
  }

  // ── Messages ──
  let lastDate = null;
  let lastUid  = null;

  function listenMessages() {
    const q = query(ref(db, 'messages'), limitToLast(100));
    onChildAdded(q, snap => appendMessage(snap.val()));
  }

  function appendMessage(msg) {
    const isOwn = currentUser && msg.uid === currentUser.uid;
    const d     = new Date(msg.ts || Date.now());
    const dateStr = d.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

    if (dateStr !== lastDate) {
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = dateStr;
      messagesEl.appendChild(div);
      lastDate = dateStr;
      lastUid  = null;
    }

    const wrap   = document.createElement('div');
    wrap.className = `msg ${isOwn ? 'own' : 'other'}`;

    const showMeta = msg.uid !== lastUid;
    if (showMeta) {
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      const uname = document.createElement('span');
      uname.className = 'uname';
      uname.textContent = msg.username || 'anon';
      const time = document.createElement('span');
      time.textContent = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      if (!isOwn) meta.appendChild(uname);
      meta.appendChild(time);
      wrap.appendChild(meta);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;
    wrap.appendChild(bubble);

    messagesEl.appendChild(wrap);
    lastUid = msg.uid;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Send ──
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !currentUser) return;
    msgInput.value = '';
    autoResize();
    sendBtn.disabled = true;
    try {
      await push(ref(db, 'messages'), {
        text,
        uid:      currentUser.uid,
        username: currentUser.displayName || currentUser.email.split('@')[0],
        ts:       serverTimestamp()
      });
    } catch(e) { console.error(e); }
    sendBtn.disabled = false;
    msgInput.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Auto-resize textarea ──
  function autoResize() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  }
  msgInput.addEventListener('input', autoResize);

  // ── Error messages ──
  function friendlyError(code) {
    const map = {
      'auth/invalid-email':          'Invalid email address.',
      'auth/user-not-found':         'No account with that email.',
      'auth/wrong-password':         'Incorrect password.',
      'auth/email-already-in-use':   'Email already in use.',
      'auth/weak-password':          'Password must be at least 6 characters.',
      'auth/too-many-requests':      'Too many attempts. Try again later.',
      'auth/invalid-credential':     'Invalid email or password.',
    };
    return map[code] || 'Something went wrong. Try again.';
  }
</script>
</body>
</html>
