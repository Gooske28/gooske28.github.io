<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <!-- GoatCounter -->
  <script data-goatcounter="https://gooske.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #222228;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: #888;
      --accent: #01bfa5;
      --accent-dim: rgba(1,191,165,0.15);
      --green: #01e3c0;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* JOIN SCREEN */
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 12px;
      padding: 2rem;
    }

    #join-screen h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    #join-screen h1 span { color: var(--accent); }

    #join-screen p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      text-align: center;
    }

    .join-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }

    .join-form input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .join-form input:focus { border-color: var(--accent); }
    .join-form input::placeholder { color: var(--muted); }

    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 11px 14px;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }

    #join-error {
      color: #f87171;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    /* CHAT SCREEN */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .logo { font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }

    .logo-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* STATUS BAR */
    #status-bar {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.open   { background: var(--muted); }
    .status-dot.active { background: var(--green); }

    #typing-bar {
      height: 24px;
      padding: 0 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #typing-name {
      font-size: 12px;
      color: var(--muted);
    }

    .typing-dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;
      background: var(--muted);
      border-radius: 50%;
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-4px); opacity: 1; }
    }

    .btn-faq {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 7px;
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 11px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-faq:hover { background: var(--accent); color: #fff; }

    .header-right { display: flex; align-items: center; gap: 8px; }

    #username-display {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      padding: 5px 11px;
      transition: all 0.15s;
    }

    .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    /* MESSAGES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: min(72%, 560px);
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.own   { align-self: flex-end;   align-items: flex-end; }
    .msg.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      padding: 0 4px;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .msg-meta .uname { font-weight: 500; }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.own .msg-bubble {
      background: var(--accent);
      border-bottom-right-radius: 4px;
    }

    .msg.other .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }



    .date-divider {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 12px;
      border-radius: 20px;
      margin: 12px 0;
    }

    /* INPUT BAR */
    #input-bar {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--bg);
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      max-height: 120px;
      outline: none;
      overflow-y: auto;
      padding: 9px 13px;
      resize: none;
      transition: border-color 0.15s;
    }

    #msg-input:focus { border-color: rgba(1,191,165,0.5); }
    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 18px;
      height: 40px;
      line-height: 1;
      transition: opacity 0.15s, transform 0.1s;
      width: 40px;
    }

    #send-btn:hover { opacity: 0.85; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.3; cursor: default; }

    /* SETUP BANNER */
    #setup-banner {
      background: rgba(1,191,165,0.1);
      border: 1px solid rgba(1,191,165,0.3);
      border-radius: 10px;
      color: #7de8dc;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 20px 16px;
      padding: 12px 16px;
    }

    #setup-banner code {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 1px 5px;
    }

    #setup-banner a { color: var(--accent); }
    #img-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      font-size: 17px;
      height: 40px;
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    #img-btn:hover { border-color: var(--accent); color: var(--accent); }
    #img-btn:disabled { opacity: 0.3; cursor: default; }

    .msg-image {
      max-width: 240px;
      max-height: 200px;
      border-radius: var(--radius);
      display: block;
      cursor: pointer;
      object-fit: cover;
    }
    .msg.own  .msg-image { border-bottom-right-radius: 4px; }
    .msg.other .msg-image { border-bottom-left-radius: 4px; }

    .faq-link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .faq-link:hover { color: var(--accent); }
  </style>
</head>
<body>

<!-- JOIN SCREEN -->
<div id="join-screen">
  <h1><span>◈</span> Chat</h1>
  <p>Pick a username to join.</p>
  <div class="join-form">
    <input id="username-input" type="text" placeholder="Username" maxlength="24" autocomplete="off" spellcheck="false" />
    <button class="btn-primary" id="join-btn">Join chat</button>
    <div id="join-error"></div>
    <a href="/chat/faq" class="faq-link">FAQ</a>
    <a href="/" class="faq-link">← Home</a>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <header>
    <div class="header-left">
      <div class="logo"><span class="logo-dot"></span>Chat</div>
      <span id="status-bar">
        <span class="status-dot active"></span><span id="active-count">0</span> active
        &nbsp;·&nbsp;
        <span class="status-dot open"></span><span id="open-count">0</span> open
      </span>
    </div>
    <div class="header-right">
      <span id="username-display"></span>
      <a href="/" class="btn-ghost">Home</a>
      <a href="/chat/faq" class="btn-faq">FAQ</a>
      <button class="btn-ghost" id="leave-btn">Leave</button>
    </div>
  </header>
  <div id="typing-bar" style="display:none">
    <span id="typing-name"></span>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  </div>

  <div id="setup-banner" style="display:none">
    ⚠️ <strong>Firebase not configured.</strong> Paste your config, enable <strong>Anonymous</strong> auth,
    create a <strong>Realtime Database</strong>, and enable <strong>Storage</strong>.
    <a href="https://firebase.google.com/docs/web/setup" target="_blank">Setup guide →</a>
  </div>

  <div id="messages"></div>

  <div id="input-bar">
    <button id="img-btn" title="Send image">🖼</button>
    <input id="img-input" type="file" accept="image/*" style="display:none" />
    <textarea id="msg-input" rows="1" placeholder="Message…"></textarea>
    <button id="send-btn" title="Send">↑</button>
  </div>
</div>

<script type="module">
  // ─────────────────────────────────────────────────────────────────
  //  ▼▼▼  FIREBASE CONFIG  ▼▼▼
  //
  //  1. Go to https://console.firebase.google.com/
  //  2. Create a project → add a Web app → copy config below
  //  3. Authentication → Sign-in method → enable "Anonymous"
  //  4. Build → Realtime Database → Create database (test mode)
  //     Rules:
  //     {
  //       "rules": {
  //         "messages": { ".read": "auth != null", ".write": "auth != null" },
  //         "presence":  { ".read": "auth != null", ".write": "auth != null" },
  //         "typing":    { ".read": "auth != null", ".write": "auth != null" }
  //       }
  //     }
  //
  // ─────────────────────────────────────────────────────────────────
    const firebaseConfig = {
  apiKey: "AIzaSyCH3c4qGv7eAhNlfkc45iNY52tHzkJYNuQ",
  authDomain: "gooske-7a596.firebaseapp.com",
  databaseURL: "https://gooske-7a596-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gooske-7a596",
  storageBucket: "gooske-7a596.firebasestorage.app",
  messagingSenderId: "417819629898",
  appId: "1:417819629898:web:5c0890fb8069678f79c9b3"
};
  // ─────────────────────────────────────────────────────────────────

  // ── Secret code to wipe all messages ──
  // Type  /clear YOUR_CODE  in the chat to delete everything.
  const DELETE_CODE = "Ymduq";

const CONFIGURED = !firebaseConfig.apiKey.startsWith("PASTE");

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInAnonymously, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded,
           serverTimestamp, onValue, set, remove,
           onDisconnect, query, limitToLast,
           get, orderByKey }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


  // DOM refs
  const joinScreen    = document.getElementById('join-screen');
  const chatScreen    = document.getElementById('chat-screen');
  const usernameInput = document.getElementById('username-input');
  const joinBtn       = document.getElementById('join-btn');
  const joinError     = document.getElementById('join-error');
  const messagesEl    = document.getElementById('messages');
  const msgInput      = document.getElementById('msg-input');
  const sendBtn       = document.getElementById('send-btn');
  const leaveBtn      = document.getElementById('leave-btn');
  const uDisplay      = document.getElementById('username-display');
  const activeCount   = document.getElementById('active-count');
  const openCount     = document.getElementById('open-count');
  const typingBar     = document.getElementById('typing-bar');
  const typingName    = document.getElementById('typing-name');
  const imgBtn        = document.getElementById('img-btn');
  const imgInput      = document.getElementById('img-input');
  const setupBanner   = document.getElementById('setup-banner');


  if (!CONFIGURED) setupBanner.style.display = 'block';

  const app     = initializeApp(firebaseConfig);
  const auth    = getAuth(app);
  const db      = getDatabase(app);

  let currentUser = null;
  let currentUsername = '';
  let msgListenerAttached = false;

  // ── Join ──
  joinBtn.addEventListener('click', joinChat);
  usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });

  async function joinChat() {
    const name = usernameInput.value.trim();
    if (!name) { joinError.textContent = 'Please enter a username.'; return; }
    if (name.length < 2) { joinError.textContent = 'Username must be at least 2 characters.'; return; }
    if (!/^[a-zA-Z0-9_\-. ]+$/.test(name)) {
      joinError.textContent = 'Letters, numbers, spaces, _ - . only.';
      return;
    }
    joinBtn.disabled = true;
    joinError.textContent = '';
    try {
      const cred = await signInAnonymously(auth);
      currentUser = cred.user;
      currentUsername = name;
      uDisplay.textContent = name;
      joinScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      setupPresence(currentUser.uid, name);
      if (!msgListenerAttached) { listenMessages(); listenTyping(); msgListenerAttached = true; }
      msgInput.focus();
      await push(ref(db, 'messages'), {
        text: `${name} joined the chat`,
        uid: '__system__', username: '', ts: serverTimestamp()
      });
    } catch (e) {
      joinError.textContent = 'Could not connect. Check Firebase config.';
      console.error(e);
      joinBtn.disabled = false;
    }
  }

  // ── Leave ──
  leaveBtn.addEventListener('click', async () => {
    if (currentUser) {
      setTyping(false);
      await push(ref(db, 'messages'), {
        text: `${currentUsername} left the chat`,
        uid: '__system__', username: '', ts: serverTimestamp()
      });
      await set(ref(db, `presence/${currentUser.uid}`), null);
      await signOut(auth);
    }
    currentUser = null;
    currentUsername = '';
    msgListenerAttached = false;
    messagesEl.innerHTML = '';
    lastDate = null; lastUid = null;
    joinBtn.disabled = false;
    usernameInput.value = '';
    chatScreen.style.display = 'none';
    joinScreen.style.display = 'flex';
  });

  // ── Presence (open vs active) ──
  function setupPresence(uid, name) {
    const pRef = ref(db, `presence/${uid}`);
    const isActive = !document.hidden && document.hasFocus();
    set(pRef, { uid, name, active: isActive });
    onDisconnect(pRef).remove();

    const updatePresence = () => {
      const active = !document.hidden && document.hasFocus();
      set(pRef, { uid, name, active });
    };
    document.addEventListener('visibilitychange', updatePresence);
    window.addEventListener('focus', updatePresence);
    window.addEventListener('blur',  updatePresence);

    onValue(ref(db, 'presence'), snap => {
      if (!snap.exists()) { activeCount.textContent = '0'; openCount.textContent = '0'; return; }
      const vals = Object.values(snap.val());
      activeCount.textContent = vals.filter(v => v.active).length;
      openCount.textContent   = vals.length;
    });
  }

  // ── Typing indicator ──
  let typingTimeout = null;
  let isTyping = false;

  function setTyping(val) {
    if (!currentUser) return;
    isTyping = val;
    set(ref(db, `typing/${currentUser.uid}`), val ? { name: currentUsername } : null);
  }

  function listenTyping() {
    onValue(ref(db, 'typing'), snap => {
      if (!snap.exists()) { typingBar.style.display = 'none'; return; }
      const names = Object.entries(snap.val())
        .filter(([uid]) => uid !== currentUser?.uid)
        .map(([, v]) => v.name);
      if (names.length === 0) {
        typingBar.style.display = 'none';
      } else {
        const label = names.length === 1 ? names[0] : `${names.slice(0,-1).join(', ')} & ${names.at(-1)}`;
        typingName.textContent = label;
        typingBar.style.display = 'flex';
      }
    });
  }

  // ── Messages ──
  let lastDate = null;
  let lastUid  = null;

  function listenMessages() {
    const q = query(ref(db, 'messages'), limitToLast(100));
    onChildAdded(q, snap => appendMessage(snap.val()));
  }

  function appendMessage(msg) {
    const isSystem = msg.uid === '__system__';
    const isOwn    = !isSystem && currentUser && msg.uid === currentUser.uid;
    const d        = new Date(msg.ts || Date.now());
    const dateStr  = d.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

    if (dateStr !== lastDate) {
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = dateStr;
      messagesEl.appendChild(div);
      lastDate = dateStr;
      lastUid  = null;
    }

    if (isSystem) {
      const sys = document.createElement('div');
      sys.className = 'date-divider';
      sys.style.fontStyle = 'italic';
      sys.textContent = msg.text;
      messagesEl.appendChild(sys);
      lastUid = null;
    } else {
      const wrap = document.createElement('div');
      wrap.className = `msg ${isOwn ? 'own' : 'other'}`;

      if (msg.uid !== lastUid) {
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        if (!isOwn) {
          const uname = document.createElement('span');
          uname.className = 'uname';
          uname.textContent = msg.username || 'anon';
          meta.appendChild(uname);
        }
        const time = document.createElement('span');
        time.textContent = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        meta.appendChild(time);
        wrap.appendChild(meta);
      }

      if (msg.image) {
        const im = document.createElement('img');
        im.src = msg.image;
        im.className = 'msg-image';
        im.alt = 'image';
        im.onclick = () => window.open(msg.image, '_blank');
        wrap.appendChild(im);
      } else {
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = msg.text;
        wrap.appendChild(bubble);
      }

      messagesEl.appendChild(wrap);
      lastUid = msg.uid;
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Send ──
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !currentUser) return;
    msgInput.value = '';
    autoResize();
    clearTimeout(typingTimeout);
    setTyping(false);

    const clearMatch = text.match(/^\/clear\s+(.+)$/);
    if (clearMatch) {
      if (clearMatch[1].trim() === DELETE_CODE) {
        try {
          await remove(ref(db, 'messages'));
          messagesEl.innerHTML = '';
          lastDate = null; lastUid = null;
          await push(ref(db, 'messages'), {
            text: 'Chat was cleared.',
            uid: '__system__', username: '', ts: serverTimestamp()
          });
        } catch(e) { console.error(e); }
      } else {
        showLocalError('Wrong code.');
      }
      msgInput.focus();
      return;
    }

    sendBtn.disabled = true;
    try {
      await pruneOldMessages();
      await push(ref(db, 'messages'), {
        text,
        uid:      currentUser.uid,
        username: currentUsername,
        ts:       serverTimestamp()
      });
    } catch(e) { console.error(e); }
    sendBtn.disabled = false;
    msgInput.focus();
  }

  function showLocalError(msg) {
    const err = document.createElement('div');
    err.className = 'date-divider';
    err.style.color = '#f87171';
    err.textContent = msg;
    messagesEl.appendChild(err);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    setTimeout(() => err.remove(), 3000);
  }

  // ── Image upload ──
  const MAX_IMG_BYTES = 500 * 1024; // 500 KB after compression
  const MAX_STORED_IMGS = 5;

  imgBtn.addEventListener('click', () => imgInput.click());

  imgInput.addEventListener('change', async () => {
    const file = imgInput.files[0];
    imgInput.value = '';
    if (!file || !currentUser) return;
    if (!file.type.startsWith('image/')) { showLocalError('Only images are supported.'); return; }

    imgBtn.disabled = true;
    try {
      const base64 = await compressImage(file);
      // Rough size check: base64 string length * 0.75 ≈ bytes
      if (base64.length * 0.75 > MAX_IMG_BYTES) {
        showLocalError('Image too large even after compression (max ~500 KB).');
        imgBtn.disabled = false;
        return;
      }
      await pruneOldImages();
      await push(ref(db, 'messages'), {
        uid:      currentUser.uid,
        username: currentUsername,
        ts:       serverTimestamp(),
        image:    base64
      });
    } catch(e) { console.error(e); showLocalError('Failed to send image.'); }
    imgBtn.disabled = false;
  });

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const MAX_DIM = 800;
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            if (width > height) { height = Math.round(height * MAX_DIM / width); width = MAX_DIM; }
            else                { width = Math.round(width * MAX_DIM / height);  height = MAX_DIM; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function autoResize() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  }

  async function pruneOldMessages() {
    const snap = await get(query(ref(db, 'messages'), orderByKey()));
    if (!snap.exists()) return;
    const keys = [];
    snap.forEach(child => keys.push(child.key));
    const toDelete = keys.slice(0, Math.max(0, keys.length - 99));
    await Promise.all(toDelete.map(k => remove(ref(db, `messages/${k}`))));
  }

  async function pruneOldImages() {
    // Fetch all messages and collect keys of image messages, oldest first
    const snap = await get(query(ref(db, 'messages'), orderByKey()));
    if (!snap.exists()) return;
    const imgKeys = [];
    snap.forEach(child => { if (child.val().image) imgKeys.push(child.key); });
    // Delete all but the last (MAX_STORED_IMGS - 1) so there's room for the new one
    const toDelete = imgKeys.slice(0, Math.max(0, imgKeys.length - (MAX_STORED_IMGS - 1)));
    await Promise.all(toDelete.map(k => remove(ref(db, `messages/${k}`))));
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  msgInput.addEventListener('input', () => {
    autoResize();
    if (!isTyping) setTyping(true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => setTyping(false), 2000);
  });
</script>

<button id="help-toggle" title="Help">?</button>

<div id="help-panel">
  <div id="help-header">
    <span>Help assistant</span>
    <button id="help-close">✕</button>
  </div>
  <div id="help-messages">
    <div class="help-msg bot">Hi! Ask me anything about how this site works.</div>
  </div>
  <div id="help-input-bar">
    <textarea id="help-input" rows="1" placeholder="Ask a question…"></textarea>
    <button id="help-send">↑</button>
  </div>
</div>

<script>
(function() {
  // ── Set this to your deployed Cloudflare Worker URL ──
  const WORKER_URL = "https://gooske.noahbrown1252.workers.dev";

  const toggle   = document.getElementById('help-toggle');
  const panel    = document.getElementById('help-panel');
  const closeBtn = document.getElementById('help-close');
  const msgsEl   = document.getElementById('help-messages');
  const input    = document.getElementById('help-input');
  const sendBtn  = document.getElementById('help-send');

  let history = [];

  toggle.addEventListener('click', () => panel.classList.toggle('open'));
  closeBtn.addEventListener('click', () => panel.classList.remove('open'));

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `help-msg ${role === 'user' ? 'user' : 'bot'}`;
    div.textContent = text;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'help-msg typing';
    div.id = 'help-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function hideTyping() {
    const t = document.getElementById('help-typing');
    if (t) t.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      hideTyping();
      if (data.error) {
        addMsg('bot', "Sorry, something went wrong. Try again later.");
        console.error(data.error);
      } else {
        addMsg('bot', data.text);
        history.push({ role: 'assistant', content: data.text });
      }
    } catch (e) {
      hideTyping();
      addMsg('bot', "Couldn't reach the help assistant. Check your connection.");
      console.error(e);
    }
    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 80) + 'px';
  });
})();
</script>
